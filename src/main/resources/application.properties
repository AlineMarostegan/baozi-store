spring.application.name=baozi-store

# ===== BANCO DE DADOS (MySQL) =====
# O banco "baozi_store" e criado sozinho se nao existir.
spring.datasource.url=jdbc:mysql://localhost:3306/baozi_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
# >>> TROQUE PELA SENHA DO SEU MYSQL <<<
spring.datasource.password=SUA_SENHA_AQUI

# ===== JPA / HIBERNATE =====
# update = cria/atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
